      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand("copy");
        ta.remove();
        toast(ok ? okMsg : "Toque e segure no texto para copiar");
      } catch (e) { toast("Toque e segure no texto para copiar"); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
    } else { fallback(); }
  }
  function go(id) {
    var el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }

  /* ---------- página pública ---------- */
  function render() {
    var rules = String(cfg.regras || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    var premioTxt = String(cfg.premio || "").trim();
    var premioAlt = premioTxt ? ", " + premioTxt : "";
    var hero = cfg.banner
      ? '<h1 class="sr">Mega 2027, concurso especial' + esc(premioAlt) + '</h1><div class="banner"><img src="' + esc(cfg.banner) + '" alt="Mega 2027, concurso especial' + esc(premioAlt) + '. Prêmio não acumula!"></div>'
      : '<h1><span class="t1 gold">MEGA</span><span class="t2 gold"><b>2027</b></span></h1>' +
        '<div class="ribbon">CONCURSO ESPECIAL</div>' +
        (premioTxt ? '<div class="prize gold">' + esc(premioTxt) + '</div>' : '') +
        '<div class="balls" aria-hidden="true"><span class="ball">06</span><span class="ball">14</span><span class="ball">27</span><span class="ball">33</span><span class="ball">48</span><span class="ball">59</span></div>' +
        '<div class="seal">PRÊMIO NÃO ACUMULA!</div>';

    var stats = [
      ["Data do sorteio", dateBR(cfg.dataSorteio)],
      ["Valor por cota", money(cfg.valorCota)],
      ["Prazo para pagamento", dateBR(cfg.prazoPagamento)]
    ].map(function (s) { return '<div class="stat"><span>' + s[0] + '</span><b class="gold">' + esc(s[1]) + '</b></div>'; }).join("");

    var faq = (cfg.faq || []).map(function (f) {
      return '<details><summary>' + esc(f.q) + '</summary><div class="ans">' + tokens(f.a) + '</div></details>';
    }).join("");

    app.innerHTML =
      '<canvas id="fx" aria-hidden="true"></canvas>' +
      '<div id="site">' +
      '<header class="hero wrap" id="topo">' + hero +
        '<div class="lead"><h2>Vamos juntos participar desse bolão!</h2>' +
        '<p>Junte-se ao nosso grupo e participe dessa oportunidade especial.</p>' +
        '<button class="btn btn-gold" id="cta-main" data-go="whatsapp" type="button">QUERO PARTICIPAR DO BOLÃO!</button></div>' +
      '</header>' +

      '<section class="sec wrap" id="como"><h2 class="sec-title gold">Como participar</h2>' +
        '<p class="sec-sub">Três passos simples.</p>' +
        '<ol class="steps">' +
          '<li class="step"><span class="n">1</span><h3>Entre no grupo</h3><p>Acesse nosso grupo oficial no WhatsApp.<a class="steplink wa" href="' + esc(cfg.waLink) + '" target="_blank" rel="noopener noreferrer">ENTRAR NO GRUPO</a></p></li>' +
          '<li class="step"><span class="n">2</span><h3>Preencha o formulário</h3><p>Preencha o formulário com seus dados e confira o valor da cota e as condições do bolão.' + (cfg.formLink ? '<a class="steplink" href="' + esc(cfg.formLink) + '" target="_blank" rel="noopener noreferrer">PREENCHER FORMULÁRIO</a>' : '') + '</p></li>' +
          '<li class="step"><span class="n">3</span><h3>Faça o Pix</h3><p>Utilize a chave Pix disponibilizada pelo organizador e envie o comprovante conforme as instruções.<button class="steplink" type="button" data-go="pix">FAZER O PIX</button></p></li>' +
        '</ol></section>' +

      '<section class="sec wrap" id="whatsapp"><div class="wa-box">' +
        '<h2 class="sec-title gold">Grupo oficial</h2>' +
        '<p class="sec-sub" style="margin-bottom:20px">Os avisos, os jogos e as instruções ficam no grupo.</p>' +
        '<a class="btn btn-wa" id="wa-btn" href="' + esc(cfg.waLink) + '" target="_blank" rel="noopener noreferrer">' + WA_SVG + '<span>ENTRAR NO GRUPO DO BOLÃO</span></a>' +
      '</div></section>' +

      '<section class="sec wrap" id="pix"><div class="pix">' +
        '<h2 class="sec-title gold">Garanta sua participação!</h2>' +
        '<div class="price"><small>Valor da cota</small><strong class="gold">' + esc(money(cfg.valorCota)) + '</strong></div>' +
        '<div class="rows">' +
          '<div class="row"><span>Responsável pelo recebimento</span><b>' + esc(cfg.pixTitular) + '</b></div>' +
          '<div class="row"><span>Tipo de chave Pix</span><b>' + esc(cfg.pixTipo) + '</b></div>' +
          '<div class="row"><span>Chave Pix</span><b class="mono">' + esc(cfg.pixChave) + '</b></div>' +
        '</div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-gold" type="button" data-act="copykey">COPIAR CHAVE PIX</button>' +
          '<button class="btn btn-ghost" type="button" data-act="paypix">PAGAR COM PIX</button>' +
        '</div>' +
        '<p class="note">Depois de pagar, envie o comprovante no grupo. Sua participação só é confirmada quando o organizador conferir o recebimento.</p>' +
      '</div></section>' +

      '<section class="sec wrap" id="info"><h2 class="sec-title gold">Informações do bolão</h2>' +
        '<div class="stats">' + stats + '</div>' +
        '<div class="rules"><h3>Regras de participação</h3><ul>' + rules.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + '</ul></div>' +
      '</section>' +

      '<section class="sec wrap" id="faq"><h2 class="sec-title gold">Perguntas frequentes</h2><div class="faq">' + faq + '</div></section>' +

      '<footer class="foot wrap"><p>Bolão organizado entre os participantes do grupo. Não existe garantia de premiação. Apenas para maiores de 18 anos. Jogue com responsabilidade.</p>' +
        '<button class="linkbtn" type="button" data-act="admin">ADMINISTRADOR</button></footer>' +
      '</div>' +
      '<div class="sticky" id="sticky"><button class="btn btn-gold" type="button" data-go="whatsapp">QUERO PARTICIPAR DO BOLÃO!</button></div>' +
      '<div id="overlay"></div>';

    startFx();
    watchSticky();
  }

  function watchSticky() {
    var btn = $("#cta-main"), bar = $("#sticky");
    if (!btn || !bar || !("IntersectionObserver" in window)) return;
    new IntersectionObserver(function (en) { bar.classList.toggle("on", !en[0].isIntersecting && en[0].boundingClientRect.top < 0); }, { threshold: 0 }).observe(btn);
  }

  /* partículas douradas */
  function startFx() {
    var c = $("#fx"); if (!c) return;
    var ctx = c.getContext("2d"), dpr = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0, P = [];
    var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    function size() { W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    size(); addEventListener("resize", size);
    for (var i = 0; i < 46; i++) P.push({ x: Math.random(), y: Math.random(), r: .6 + Math.random() * 1.9, v: .03 + Math.random() * .08, a: .25 + Math.random() * .6, p: Math.random() * 6.28 });
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      P.forEach(function (p) {
        if (!calm) { p.y -= p.v / 60; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); } }
        var tw = calm ? 1 : .6 + .4 * Math.sin(t / 700 + p.p);
        var g = ctx.createRadialGradient(p.x * W, p.y * H, 0, p.x * W, p.y * H, p.r * 4);
        g.addColorStop(0, "rgba(251,233,160," + (p.a * tw) + ")"); g.addColorStop(1, "rgba(224,177,60,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x * W, p.y * H, p.r * 4, 0, 6.283); ctx.fill();
      });
      if (!calm) requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  }

  /* ---------- Pix ---------- */
  function openPix() {
    var qr = "";
    if (cfg.qrImage) {
      qr = '<div class="qr"><img src="' + esc(cfg.qrImage) + '" alt="QR Code Pix"></div>';
    } else if (cfg.pixCopiaCola && window.qrcode) {
      try {
        var q = window.qrcode(0, "M"); q.addData(cfg.pixCopiaCola); q.make();
        qr = '<div class="qr"><img src="' + q.createDataURL(6, 4) + '" alt="QR Code Pix gerado a partir do código Copia e Cola"></div>';
      } catch (e) { qr = ""; }
    }
    var code = cfg.pixCopiaCola
      ? '<div class="code" id="pix-code">' + esc(cfg.pixCopiaCola) + '</div><button class="btn btn-gold" type="button" data-act="copycode">COPIAR CÓDIGO PIX COPIA E COLA</button>'
      : "";
    var empty = (!qr && !code)
      ? '<p class="note">O organizador ainda não cadastrou o QR Code. Use a chave Pix da página.</p><button class="btn btn-gold" type="button" data-act="copykey">COPIAR CHAVE PIX</button>' : "";
    showOverlay('<div class="dlg" role="dialog" aria-modal="true" aria-label="Pagar com Pix"><button class="x" type="button" data-act="close" aria-label="Fechar">×</button>' +
      '<h2 class="gold">Pagar com Pix</h2>' +
      '<p class="note" style="text-align:left">Valor da cota: <b>' + esc(money(cfg.valorCota)) + '</b><br>Titular: ' + esc(cfg.pixTitular) + '</p>' +
      qr + code + empty +
      '<p class="note">O pagamento só é confirmado depois que o organizador verificar o recebimento. Envie o comprovante no grupo.</p></div>');
  }

  function showOverlay(html) {
    var o = $("#overlay"); o.innerHTML = '<div class="ov" data-act="ovbg">' + html + '</div>';
    document.body.style.overflow = "hidden";
    var f = o.querySelector("button"); if (f) f.focus();
  }
  function closeOverlay() { $("#overlay").innerHTML = ""; document.body.style.overflow = ""; }

  /* ---------- administrador ---------- */
  var draft = null;

  async function openAdmin() {
    var user = null, art = null;
    try { user = await claude.use("user"); art = await claude.use("artifact"); } catch (e) {}
    var allowed = false;
    try { allowed = !!(user && art && user.canEdit()); } catch (e) {}
    if (!allowed) {
      showOverlay('<div class="dlg" role="dialog" aria-modal="true" aria-label="Administrador"><button class="x" type="button" data-act="close" aria-label="Fechar">×</button>' +
        '<h2 class="gold">Área do administrador</h2>' +
        '<p class="note" style="text-align:left">Somente o organizador pode editar. Abra esta página logado na conta do Claude que criou o bolão (ou de alguém com permissão de edição) e toque em ADMINISTRADOR de novo.</p>' +
        '<button class="btn btn-gold" type="button" data-act="close">ENTENDI</button></div>');
      return;
    }
    draft = JSON.parse(JSON.stringify(cfg));
    renderAdmin();
  }

  function f(id, label, val, extra) {
    return '<label>' + label + '<input id="a-' + id + '" value="' + esc(val) + '" ' + (extra || "") + '></label>';
  }
  function renderAdmin() {
    var faq = draft.faq.map(function (q, i) {
      return '<div class="faqrow"><label>Pergunta<input id="fq-' + i + '" value="' + esc(q.q) + '"></label>' +
        '<label>Resposta<textarea id="fa-' + i + '">' + esc(q.a) + '</textarea></label>' +
        '<button class="mini danger" type="button" data-act="faqdel" data-i="' + i + '">Remover pergunta</button></div>';
    }).join("");
    var tipos = ["CPF", "CNPJ", "Celular", "E-mail", "Chave aleatória"].map(function (t) {
      return '<option' + (t === draft.pixTipo ? " selected" : "") + '>' + t + '</option>';
    }).join("");
    showOverlay('<div class="dlg adm" role="dialog" aria-modal="true" aria-label="Painel do administrador"><button class="x" type="button" data-act="close" aria-label="Fechar">×</button>' +
      '<h2 class="gold">Painel do administrador</h2>' +
      '<p class="hint">Altere os campos e toque em Salvar e publicar. A página pública atualiza para todos.</p>' +
      '<fieldset><legend>WhatsApp e formulário</legend>' + f("waLink", "Link do grupo", draft.waLink, 'type="url" inputmode="url" placeholder="https://chat.whatsapp.com/..."') + f("formLink", "Link do formulário (passo 2)", draft.formLink, 'type="url" inputmode="url" placeholder="https://docs.google.com/forms/..."') + '</fieldset>' +
      '<fieldset><legend>Pix</legend><div class="two">' +
        '<label>Tipo de chave<select id="a-pixTipo">' + tipos + '</select></label>' +
        f("pixChave", "Chave Pix", draft.pixChave) + '</div>' +
        f("pixTitular", "Nome do titular da chave", draft.pixTitular) +
        '<label>Pix Copia e Cola<textarea id="a-pixCopiaCola" placeholder="00020126...">' + esc(draft.pixCopiaCola) + '</textarea><span class="hint">Se você não enviar uma imagem de QR Code, a página gera o QR a partir deste código.</span></label>' +
        '<div><label>Imagem do QR Code Pix (opcional)<input id="a-qr" type="file" accept="image/*"></label>' +
          (draft.qrImage ? '<p><img class="thumb" src="' + esc(draft.qrImage) + '" alt="QR atual"></p><button class="mini danger" type="button" data-act="qrdel">Remover imagem</button>' : "") + '</div>' +
      '</fieldset>' +
      '<fieldset><legend>Bolão</legend><div class="two">' +
        f("valorCota", "Valor da cota (R$)", draft.valorCota, 'inputmode="decimal" placeholder="20,00"') +
        f("premio", "Destaque do prêmio (opcional, deixe vazio para não mostrar)", draft.premio) +
        f("dataSorteio", "Data do sorteio", draft.dataSorteio, 'type="date"') +
        f("prazoPagamento", "Prazo de pagamento", draft.prazoPagamento, 'type="date"') +
      '</div></fieldset>' +
      '<fieldset><legend>Regras</legend><label>Uma regra por linha<textarea id="a-regras" style="min-height:150px">' + esc(draft.regras) + '</textarea></label></fieldset>' +
      '<fieldset><legend>Imagem de capa</legend><label>Imagem do banner (opcional)<input id="a-banner" type="file" accept="image/*"></label>' +
        '<span class="hint">Se enviar uma imagem, ela substitui o título desenhado no topo da página.</span>' +
        (draft.banner ? '<p><img class="thumb" src="' + esc(draft.banner) + '" alt="Banner atual"></p><button class="mini danger" type="button" data-act="bandel">Remover imagem</button>' : "") + '</fieldset>' +
      '<fieldset><legend>Perguntas frequentes</legend><p class="hint">Use {valor}, {prazo}, {sorteio} e {concurso} nas respostas para inserir os dados atuais.</p>' + faq +
        '<button class="mini" type="button" data-act="faqadd">+ Adicionar pergunta</button></fieldset>' +
      '<div class="btn-row"><button class="btn btn-gold" type="button" data-act="save">SALVAR E PUBLICAR</button><button class="btn btn-ghost" type="button" data-act="close">CANCELAR</button></div>' +
      '<div class="stat-msg" id="msg" role="status"></div></div>');

    var qin = $("#a-qr"), bin = $("#a-banner");
    qin.addEventListener("change", function () { pickImage(qin.files[0], 700, "image/png", 1, function (u) { collect(); draft.qrImage = u; renderAdmin(); }); });
    bin.addEventListener("change", function () { pickImage(bin.files[0], 1400, "image/jpeg", .85, function (u) { collect(); draft.banner = u; renderAdmin(); }); });
  }

  function pickImage(file, max, type, q, done) {
    if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        var x = c.getContext("2d");
        if (type === "image/jpeg") { x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); }
        x.drawImage(img, 0, 0, c.width, c.height);
        done(c.toDataURL(type, q));
      };
      img.onerror = function () { var m = $("#msg"); if (m) { m.className = "stat-msg err"; m.textContent = "Não foi possível ler essa imagem."; } };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }

  function collect() {
    ["waLink", "formLink", "pixTipo", "pixChave", "pixTitular", "pixCopiaCola", "valorCota", "concurso", "totalCotas", "cotasDisponiveis", "participantes", "premio", "dataSorteio", "prazoPagamento", "regras"].forEach(function (k) {
      var el = document.getElementById("a-" + k); if (el) draft[k] = el.value.trim();
    });
    draft.faq = draft.faq.map(function (q, i) {
      var a = document.getElementById("fq-" + i), b = document.getElementById("fa-" + i);
      return { q: a ? a.value : q.q, a: b ? b.value : q.a };
    });
  }

  function buildDoc(c) {
    var head = "";
    var styles = document.head ? Array.prototype.slice.call(document.head.querySelectorAll("style")) : [];
    var base = styles.filter(function (s) { return s.id !== "pagestyle"; })[0];
    var reset = base ? base.textContent : ":root{color-scheme:light}body{margin:0}";
    function out(sel) { var el = document.querySelector(sel); return el ? el.outerHTML : ""; }
    var json = JSON.stringify(c).replace(/</g, "\\u003c");
    var main = document.getElementById("main").textContent;
    head = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>';
    return head + out("title") + out('meta[name="claude:viewport-fit-sides"]') + out('meta[name="description"]') + out("#fonts") + out("#pagestyle") +
      '<div id="app"></div><script type="application/json" id="cfg">' + json + '<\/script><script id="main">' + main + '<\/script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"><\/script></body></html>';
  }

  async function save() {
    var msg = $("#msg");
    function say(t, k) { msg.className = "stat-msg " + (k || ""); msg.textContent = t; }
    collect();
    if (draft.waLink && !/^https:\/\/(chat\.whatsapp\.com|wa\.me)\//i.test(draft.waLink)) { say("O link do WhatsApp deve começar com https://chat.whatsapp.com/", "err"); return; }
    if (draft.formLink && !/^https:\/\//i.test(draft.formLink)) { say("O link do formulário deve começar com https://", "err"); return; }
    if (draft.pixCopiaCola && !/^000201/.test(draft.pixCopiaCola)) { say("O Pix Copia e Cola precisa começar com 000201. Copie o código completo do seu banco.", "err"); return; }
    draft.faq = draft.faq.filter(function (q) { return q.q.trim(); });
    say("Publicando...");
    try {
      var art = await claude.use("artifact");
      await art.publish(buildDoc(draft));
      say("Salvo! A página está sendo atualizada.", "ok");
    } catch (e) {
      var code = e && e.code;
      if (code === "conflict") say("Outra alteração foi publicada antes. A página vai recarregar com a versão mais recente. Refaça sua edição.", "err");
      else if (code === "not_writer" || code === "not_granted") say("Sua conta não tem permissão para editar esta página.", "err");
      else say("Não foi possível publicar. Tente de novo em instantes.", "err");
    }
  }

  /* ---------- eventos ---------- */
  app.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-go],[data-act]"); if (!t) return;
    if (t.dataset.go) { go(t.dataset.go); return; }
    var a = t.dataset.act;
    if (a === "ovbg") { if (ev.target === t) closeOverlay(); return; }
    if (a === "copykey") copy(cfg.pixChave, "Chave Pix copiada!");
    else if (a === "copycode") copy(cfg.pixCopiaCola, "Código Pix copiado!");
    else if (a === "paypix") openPix();
    else if (a === "close") closeOverlay();
    else if (a === "admin") openAdmin();
    else if (a === "save") save();
    else if (a === "faqadd") { collect(); draft.faq.push({ q: "", a: "" }); renderAdmin(); }
    else if (a === "faqdel") { collect(); draft.faq.splice(+t.dataset.i, 1); renderAdmin(); }
    else if (a === "qrdel") { collect(); draft.qrImage = ""; renderAdmin(); }
    else if (a === "bandel") { collect(); draft.banner = ""; renderAdmin(); }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && $("#overlay") && $("#overlay").innerHTML) closeOverlay(); });

  render();
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
